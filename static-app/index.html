<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="description" content="순천대학교 공지와 공모전·자격증 일정을 한곳에서 보고, 내 학과·관심사에 맞는 공지를 골라 주는 알리미">
<title>SCNU Lens</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --paper: #fafaf8; --surface: #ffffff; --ink: #1f1d1a; --muted: #6b675f; --line: #e8e5df;
    --brand: #0058b2; --brand-soft: #e8f0fa; --danger: #c62828; --warn: #b26a00;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121212; --surface: #1b1b1b; --ink: #ecebe8; --muted: #a19d95; --line: #2c2b29;
      --brand: #6aa6ff; --brand-soft: #1b2a3d; --danger: #ff6b6b; --warn: #f0b24a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font: 15px/1.45 "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  a { color: var(--brand); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* 상단 바·탭·칩은 스크롤해도 붙어 있다 */
  .top { position: sticky; top: 0; z-index: 5; background: var(--paper); padding-top: env(safe-area-inset-top); }
  .bar { display: flex; align-items: center; justify-content: space-between; height: 52px; }
  .logo { font-weight: 700; font-size: 17px; letter-spacing: -0.2px; }
  .icons { display: flex; gap: 4px; }
  .icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
  .icon:hover, .icon[aria-current="page"] { color: var(--ink); background: var(--line); }
  .icon svg { width: 21px; height: 21px; }

  .tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); }
  .tab { padding: 10px 0 9px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab small { font-weight: 500; font-size: 12px; margin-left: 3px; }
  .tab[aria-selected="true"] { color: var(--ink); border-color: var(--ink); }

  .search { display: block; margin: 10px 0 8px; position: relative; }
  .search input {
    width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
    padding: 0 12px 0 36px; outline: none;
  }
  .search input:focus { border-color: var(--brand); }
  .search svg { position: absolute; left: 11px; top: 11px; width: 18px; height: 18px; color: var(--muted); }

  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); font-size: 13px; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chip.urgent { color: var(--danger); }
  .chip.urgent[aria-pressed="true"] { background: var(--danger); border-color: var(--danger); color: #fff; }
  .chip.sort { margin-left: auto; color: var(--muted); }

  /* 공지 목록 */
  .list { list-style: none; margin: 0; padding: 0; }
  .row { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
  .row-main { flex: 1; min-width: 0; text-align: left; padding: 12px 0; }
  .row-title { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row-meta { display: block; margin-top: 3px; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-meta b { color: var(--brand); font-weight: 600; }
  .row-reason { display: block; margin-top: 3px; font-size: 12.5px; color: var(--brand); }
  .dday { flex: none; min-width: 52px; text-align: right; font-size: 13px; font-weight: 700; color: var(--muted); }
  .dday.hot { color: var(--danger); }
  .dday.closed { font-weight: 500; }
  .star { flex: none; width: 36px; height: 36px; display: grid; place-items: center; color: var(--muted); border-radius: 8px; }
  .star svg { width: 19px; height: 19px; }
  .star[aria-pressed="true"] { color: #f2a900; }
  .star[aria-pressed="true"] svg { fill: currentColor; }
  .more { display: block; width: 100%; margin-top: 12px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
  .empty { padding: 40px 0; text-align: center; color: var(--muted); }

  /* 카드(온보딩·설정) */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 12px 0; }
  .card h2 { font-size: 16px; margin: 0 0 4px; }
  .card p { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
  .field { display: block; margin-bottom: 12px; }
  .field > span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field input { width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); padding: 0 12px; outline: none; }
  .field input:focus { border-color: var(--brand); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; background: var(--paper); }
  .tag[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
  .btn { height: 42px; padding: 0 16px; border-radius: 10px; background: var(--ink); color: var(--paper); font-weight: 600; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.brand { background: var(--brand); color: #fff; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .profile-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0; font-size: 13.5px; color: var(--muted); }
  .profile-line b { color: var(--ink); }
  .link-btn { color: var(--brand); font-size: 13.5px; font-weight: 600; }
  .notice-bar { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); font-size: 13.5px; font-weight: 600; }

  /* 상세 창 */
  dialog.sheet {
    width: 100%; max-width: 640px; max-height: 88vh; margin: auto auto 0; padding: 0; border: 0;
    border-radius: 18px 18px 0 0; background: var(--surface); color: var(--ink);
  }
  dialog.sheet::backdrop { background: rgba(0, 0, 0, 0.4); }
  .sheet-body { padding: 8px 20px calc(20px + env(safe-area-inset-bottom)); overflow-y: auto; max-height: 88vh; }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 6px auto 12px; }
  .sheet-meta { font-size: 13px; color: var(--muted); }
  .sheet-meta b { color: var(--brand); }
  .sheet h2 { font-size: 18px; margin: 6px 0 10px; line-height: 1.35; }
  .deadline { display: inline-block; margin-bottom: 14px; padding: 4px 10px; border-radius: 8px; background: var(--paper); font-size: 13.5px; font-weight: 600; }
  .deadline.hot { color: var(--danger); }
  .facts { display: grid; grid-template-columns: 76px 1fr; gap: 8px 12px; margin: 0 0 16px; font-size: 14px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; word-break: break-word; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 0 0 14px; }

  /* 캘린더 */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 8px; }
  .cal-head h2 { font-size: 17px; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .dow { font-size: 12px; color: var(--muted); padding: 6px 0; }
  .dow:first-child { color: var(--danger); }
  .day { aspect-ratio: 1 / 1; max-height: 64px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px; }
  .day.out { color: var(--muted); opacity: 0.45; }
  .day.today span { background: var(--ink); color: var(--paper); border-radius: 999px; width: 26px; height: 26px; display: grid; place-items: center; }
  .day[aria-pressed="true"] { background: var(--brand-soft); }
  .dots { display: flex; gap: 3px; height: 5px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--brand); }
  .dot.deadline { background: var(--danger); }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin: 10px 0; }
  .legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; background: var(--brand); }
  .legend i.deadline { background: var(--danger); }
  .day-title { font-size: 14px; font-weight: 700; margin: 14px 0 0; }
  .kind { font-size: 12px; font-weight: 700; margin-right: 6px; color: var(--brand); }
  .kind.deadline { color: var(--danger); }
  footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="bar">
      <button class="logo" data-go="feed">SCNU Lens</button>
      <nav class="icons" aria-label="메뉴">
        <button class="icon" data-go="calendar" aria-label="캘린더">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        </button>
        <button class="icon" data-go="me" aria-label="내 설정·저장한 공지">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.6 4-5.3 7.5-5.3s6.3 1.7 7.5 5.3"/></svg>
        </button>
      </nav>
    </div>
    <div id="feed-controls">
      <div class="tabs" role="tablist" id="tabs"></div>
      <label class="search">
        <span class="sr">공지 검색</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input id="q" type="search" placeholder="제목·게시판·내용 검색" autocomplete="off">
      </label>
      <div class="chips" id="chips"></div>
    </div>
  </header>
  <main id="view"></main>
  <footer id="footer"></footer>
</div>

<dialog class="sheet" id="sheet" aria-label="공지 상세"><div class="sheet-body" id="sheet-body"></div></dialog>
<datalist id="departments"></datalist>

<script src="notices.js"></script>
<script>
"use strict";
// ───────── 데이터 ─────────
const DATA = window.SCNU_DATA || { notices: [], exported_at: null };
const NOTICES = DATA.notices;
const BY_ID = new Map(NOTICES.map((n) => [n.id, n]));
const PAGE = 20;
const URGENT_DAYS = 3;
// 관심 키워드의 같은 뜻 단어. 서버 버전(app/services/ai.py INTEREST_SYNONYMS)과 같다.
const SYNONYMS = {
  ai: ["인공지능", "머신러닝", "딥러닝", "생성형"], 인공지능: ["ai", "머신러닝", "딥러닝", "생성형"],
  코딩: ["프로그래밍", "소프트웨어", "sw", "개발자"], 프로그래밍: ["코딩", "소프트웨어", "sw"],
  취업: ["채용", "인턴", "현장실습", "일자리", "구직"], 인턴: ["인턴십", "현장실습"],
  장학금: ["장학", "학자금"], 장학: ["장학금", "학자금"], 창업: ["스타트업", "예비창업"],
  해외: ["교환학생", "어학연수", "해외파견"], 봉사: ["자원봉사", "봉사활동"], 토익: ["toeic"], toeic: ["토익"],
  공모전: ["경진대회", "해커톤"], 대학원: ["석사", "대학원생", "진학"], 자격증: ["원서접수", "자격", "기사"],
};
const SUGGESTED = ["장학금", "공모전", "취업", "AI", "자격증", "창업", "봉사", "해외"];

// ───────── 브라우저 저장(실패해도 앱은 동작) ─────────
const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* 저장 불가 환경 */ } },
};
let profile = store.get("scnu-lens-profile", null); // { dept, interests: [] }
let saved = new Set(store.get("scnu-lens-saved", []));

// ───────── 화면 상태 ─────────
const state = { tab: profile ? "me" : "school", q: "", chip: "all", sort: "latest", shown: PAGE, month: null, day: null };

// ───────── 도구 ─────────
const $ = (sel) => document.querySelector(sel);
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// 입력: 주소, 출력: http(s) 주소면 그대로, 아니면 "#"(javascript: 같은 주소를 막는다).
function safeUrl(url) { return /^https?:\/\//i.test(url || "") ? url : "#"; }
function iso(date) {
  const p = (n) => String(n).padStart(2, "0");
  return `${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}`;
}
const todayIso = () => iso(new Date());
// 입력: "YYYY-MM-DD", 출력: 오늘부터 남은 날 수. 날짜만 비교해 UTC로 읽혀 하루 밀리는 일이 없다.
function daysLeft(day) {
  if (!day) return null;
  const [y, m, d] = day.slice(0, 10).split("-").map(Number);
  const now = new Date();
  return Math.round((new Date(y, m - 1, d) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
}
function ddayLabel(n) {
  const days = daysLeft(n.deadline);
  if (days === null) return { text: "", cls: "" };
  if (days < 0) return { text: "마감됨", cls: "closed" };
  if (days === 0) return { text: "오늘 마감", cls: "hot" };
  return { text: `D-${days}`, cls: days <= URGENT_DAYS ? "hot" : "" };
}
function shortDate(day) {
  if (!day) return "";
  const [, m, d] = day.slice(0, 10).split("-").map(Number);
  return `${m}월 ${d}일`;
}
function stamp(value) {
  // "2026-10-02T18:00" → "10월 2일 18:00"
  if (!value) return "";
  const time = value.includes("T") ? " " + value.slice(11, 16) : "";
  return shortDate(value) + time;
}
const isOpen = (n) => !n.deadline || daysLeft(n.deadline) >= 0;
const haystack = (n) => `${n.title} ${n.board} ${n.category} ${n.text} ${n.details.map((d) => d.value).join(" ")} ${n.targets.join(" ")}`.toLowerCase();

// ───────── 나에게 맞는 공지 ─────────
// 학과 이름 끝(학과·전공·학부·교육과·과)과 " 공지"를 떼어 "전자공학과"와 "전자공학전공 공지"를 같게 본다.
function deptKey(name) {
  return String(name || "").replace(/\s*공지$/, "").replace(/\s+/g, "").replace(/(학과|전공|학부|교육과|과)$/, "");
}
// 영문 약어는 단어 단위로만 찾는다("ai"가 "gmail" 안에서 잡히지 않게).
function containsTerm(term, text) {
  term = term.trim().toLowerCase();
  if (!term) return false;
  if (/^[\x00-\x7f]+$/.test(term)) {
    return new RegExp(`(^|[^a-z0-9])${term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}($|[^a-z0-9])`).test(text);
  }
  return text.includes(term);
}
// 입력: 공지, 출력: { score, reasons } — 학과 게시판 +3, 관심 키워드마다 +2. 2점 이상이면 추천한다.
function relevance(n) {
  if (!profile) return { score: 0, reasons: [] };
  let score = 0;
  const reasons = [];
  const key = deptKey(profile.dept);
  if (key.length >= 2) {
    if (deptKey(n.board).includes(key)) { score += 3; reasons.push("내 학과 게시판"); }
    else if (n.targets.some((t) => deptKey(t).includes(key))) { score += 3; reasons.push("우리 학과 대상"); }
  }
  const text = haystack(n);
  const hit = profile.interests.filter((kw) => [kw, ...(SYNONYMS[kw.toLowerCase()] || [])].some((t) => containsTerm(t, text)));
  score += hit.length * 2;
  if (hit.length) reasons.push(`관심: ${hit.join(", ")}`);
  return { score, reasons };
}
function matched() {
  return NOTICES.filter(isOpen)
    .map((n) => ({ n, ...relevance(n) }))
    .filter((m) => m.score >= 2)
    .sort((a, b) => b.score - a.score || (daysLeft(a.n.deadline) ?? 9999) - (daysLeft(b.n.deadline) ?? 9999));
}

// ───────── 목록 조건 ─────────
function searchHit(n) { return !state.q || haystack(n).includes(state.q.toLowerCase()); }
const inTab = (n, tab) => n.origin === tab;
const isUrgent = (n) => { const d = daysLeft(n.deadline); return d !== null && d >= 0 && d <= URGENT_DAYS; };
function tabList() {
  let list = NOTICES.filter((n) => inTab(n, state.tab) && searchHit(n));
  if (state.chip === "urgent") list = list.filter(isUrgent);
  else if (state.chip !== "all") list = list.filter((n) => n.category === state.chip);
  if (state.sort === "deadline") {
    list = list.filter((n) => n.deadline && daysLeft(n.deadline) >= 0).sort((a, b) => a.deadline.localeCompare(b.deadline));
  }
  return list;
}

// ───────── 그리기 ─────────
const STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3.6 2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>';
function row(n, reason) {
  const dd = ddayLabel(n);
  const on = saved.has(n.id);
  return `<li class="row">
    <button class="row-main" data-open="${n.id}">
      <span class="row-title">${esc(n.title)}</span>
      <span class="row-meta"><b>${esc(n.category)}</b> · ${esc(n.board)}${n.published ? " · " + shortDate(n.published) : ""}</span>
      ${reason ? `<span class="row-reason">${esc(reason)}</span>` : ""}
    </button>
    <span class="dday ${dd.cls}">${dd.text}</span>
    <button class="star" data-star="${n.id}" aria-pressed="${on}" aria-label="${on ? "저장 취소" : "저장"}">${STAR}</button>
  </li>`;
}
function listHtml(items, toRow) {
  if (!items.length) return "";
  const more = items.length > state.shown
    ? `<button class="more" data-more>더 보기 ${Math.min(state.shown, items.length)}/${items.length}</button>` : "";
  return `<ul class="list">${items.slice(0, state.shown).map(toRow).join("")}</ul>${more}`;
}

function renderTabs() {
  const count = (tab) => NOTICES.filter((n) => inTab(n, tab)).length;
  const tabs = [["me", "나에게", ""], ["school", "학교", count("school")], ["external", "공모전·자격증", count("external")]];
  $("#tabs").innerHTML = tabs.map(([key, label, n]) =>
    `<button class="tab" role="tab" data-tab="${key}" aria-selected="${state.tab === key}">${label}${n !== "" ? `<small>${n}</small>` : ""}</button>`
  ).join("");
}

function renderChips() {
  if (state.tab === "me") { $("#chips").innerHTML = ""; return; }
  const base = NOTICES.filter((n) => inTab(n, state.tab) && searchHit(n));
  const cats = [...new Set(base.map((n) => n.category))].sort();
  const urgent = base.filter(isUrgent).length;
  const chip = (key, label, cls = "") =>
    `<button class="chip ${cls}" data-chip="${esc(key)}" aria-pressed="${state.chip === key}">${esc(label)}</button>`;
  $("#chips").innerHTML = chip("all", "전체") + (urgent ? chip("urgent", `마감임박 ${urgent}`, "urgent") : "")
    + cats.map((c) => chip(c, c)).join("")
    + `<button class="chip sort" data-sort>${state.sort === "latest" ? "최신순" : "마감순"}</button>`;
}

function profileForm(title, help) {
  const current = profile || { dept: "", interests: [] };
  const picked = new Set(current.interests);
  const custom = current.interests.filter((kw) => !SUGGESTED.includes(kw));
  return `<form class="card" id="profile-form">
    <h2>${title}</h2><p>${help}</p>
    <label class="field"><span>학과</span>
      <input name="dept" list="departments" placeholder="예: 컴퓨터교육과" value="${esc(current.dept)}" autocomplete="off"></label>
    <div class="field"><span>관심 키워드</span>
      <div class="tags" id="interest-tags">
        ${[...SUGGESTED, ...custom].map((kw) => `<button type="button" class="tag" data-kw="${esc(kw)}" aria-pressed="${picked.has(kw)}">${esc(kw)}</button>`).join("")}
      </div>
      <input name="extra" placeholder="직접 입력 후 Enter (예: 교환학생)" style="margin-top:8px">
    </div>
    <div class="actions"><button class="btn" type="submit">저장</button>
      ${profile ? '<button class="btn ghost" type="button" data-cancel>취소</button>' : ""}</div>
  </form>`;
}

function renderMe() {
  if (!profile || state.editing) {
    return profileForm("나에게 맞는 공지 받기", "학과와 관심 키워드를 고르면, 그에 맞는 공지만 골라서 보여줘요. 이 기기 브라우저에만 저장돼요.");
  }
  const list = matched().filter((m) => searchHit(m.n));
  const soon = list.filter((m) => isUrgent(m.n)).length;
  const head = `<div class="profile-line"><span><b>${esc(profile.dept || "학과 미설정")}</b> · ${esc(profile.interests.join(", ") || "관심 키워드 없음")}</span>
    <button class="link-btn" data-edit>수정</button></div>`
    + (soon ? `<div class="notice-bar">3일 안에 마감되는 공지가 ${soon}건 있어요</div>` : "");
  if (!list.length) return head + `<p class="empty">지금 맞는 공지가 없어요.<br>관심 키워드를 더 추가해 보세요.</p>`;
  return head + listHtml(list, (m) => row(m.n, m.reasons.join(" · ")));
}

function renderFeed() {
  renderTabs();
  renderChips();
  if (state.tab === "me") { $("#view").innerHTML = renderMe(); return; }
  const list = tabList();
  $("#view").innerHTML = list.length ? listHtml(list, (n) => row(n)) : `<p class="empty">조건에 맞는 공지가 없어요.</p>`;
}

// ───────── 캘린더 ─────────
function events() {
  const out = [];
  for (const n of NOTICES) {
    if (n.deadline) out.push({ day: n.deadline, kind: "마감", n, deadline: true });
    if (n.open_at) out.push({ day: n.open_at.slice(0, 10), kind: "접수 시작", n });
    for (const s of n.schedule || []) if (s.date) out.push({ day: s.date, kind: s.label || "일정", n });
  }
  return out;
}
function renderCalendar() {
  const now = new Date();
  const month = state.month || new Date(now.getFullYear(), now.getMonth(), 1);
  state.month = month;
  const first = new Date(month.getFullYear(), month.getMonth(), 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const all = events();
  const byDay = all.reduce((map, e) => (map[e.day] = [...(map[e.day] || []), e], map), {});
  const today = todayIso();
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const key = iso(d);
    const evs = byDay[key] || [];
    const dots = [evs.some((e) => e.deadline) ? '<i class="dot deadline"></i>' : "", evs.some((e) => !e.deadline) ? '<i class="dot"></i>' : ""].join("");
    cells.push(`<button class="day ${d.getMonth() !== month.getMonth() ? "out" : ""} ${key === today ? "today" : ""}" data-day="${key}" aria-pressed="${state.day === key}" aria-label="${shortDate(key)} 일정 ${evs.length}건">
      <span>${d.getDate()}</span><span class="dots">${dots}</span></button>`);
  }
  const picked = state.day ? (byDay[state.day] || []) : [];
  const dayList = state.day
    ? `<p class="day-title">${shortDate(state.day)} 일정 ${picked.length}건</p>`
      + (picked.length ? `<ul class="list">${picked.map((e) => `<li class="row"><button class="row-main" data-open="${e.n.id}">
          <span class="row-title"><span class="kind ${e.deadline ? "deadline" : ""}">${esc(e.kind)}</span>${esc(e.n.title)}</span>
          <span class="row-meta"><b>${esc(e.n.category)}</b> · ${esc(e.n.board)}</span></button></li>`).join("")}</ul>` : `<p class="empty">일정이 없어요.</p>`)
    : `<p class="hint">날짜를 누르면 그날 일정이 보여요.</p>`;
  $("#view").innerHTML = `<div class="cal-head">
      <button class="icon" data-month="-1" aria-label="이전 달">‹</button>
      <h2>${month.getFullYear()}년 ${month.getMonth() + 1}월</h2>
      <button class="icon" data-month="1" aria-label="다음 달">›</button></div>
    <div class="grid">${"일월화수목금토".split("").map((d) => `<span class="dow">${d}</span>`).join("")}${cells.join("")}</div>
    <div class="legend"><span><i class="deadline"></i>마감</span><span><i></i>접수 시작·시험·발표</span></div>${dayList}`;
}

// ───────── 내 설정·저장한 공지 ─────────
function renderSettings() {
  const list = [...saved].map((id) => BY_ID.get(id)).filter(Boolean);
  $("#view").innerHTML = `${profileForm("내 학과·관심 키워드", "나에게 탭 추천에 쓰여요. 이 기기 브라우저에만 저장돼요.")}
    <h2 class="day-title">저장한 공지 ${list.length}건</h2>
    ${list.length ? `<ul class="list">${list.map((n) => row(n)).join("")}</ul>` : `<p class="empty">목록의 별을 누르면 여기에 모여요.</p>`}`;
}

function renderFooter() {
  const at = DATA.exported_at ? new Date(DATA.exported_at) : null;
  $("#footer").innerHTML = `데이터 기준 ${at ? `${at.getMonth() + 1}월 ${at.getDate()}일 ${String(at.getHours()).padStart(2, "0")}:${String(at.getMinutes()).padStart(2, "0")}` : "-"} · 공지 ${NOTICES.length}건<br>
    출처: 순천대학교 공식 게시판, 공공데이터포털(큐넷 국가자격 시험일정·데이터 자격검정·K-Startup). 중요한 일정은 원문에서 다시 확인하세요.`;
}

function view() { return (location.hash || "#feed").slice(1); }
function render() {
  const v = view();
  $("#feed-controls").hidden = v !== "feed";
  document.querySelectorAll(".icon[data-go]").forEach((b) => b.setAttribute("aria-current", b.dataset.go === v ? "page" : "false"));
  if (v === "calendar") renderCalendar();
  else if (v === "me") renderSettings();
  else renderFeed();
}

// ───────── 상세 창 ─────────
function openSheet(id) {
  const n = BY_ID.get(id);
  if (!n) return;
  const dd = ddayLabel(n);
  const facts = [
    ...n.details.map((d) => [d.label, d.value]),
    ...(n.open_at ? [["접수 시작", stamp(n.open_at)]] : []),
    ...(n.close_at ? [["접수 마감", stamp(n.close_at)]] : []),
    ...(n.schedule || []).map((s) => [s.label, shortDate(s.date)]),
  ];
  const on = saved.has(n.id);
  $("#sheet-body").innerHTML = `<div class="grab"></div>
    <div class="sheet-meta"><b>${esc(n.category)}</b> · ${esc(n.board)}${n.published ? " · " + shortDate(n.published) : ""}</div>
    <h2>${esc(n.title)}</h2>
    ${n.deadline ? `<span class="deadline ${dd.cls}">${dd.text} · 마감 ${shortDate(n.deadline)}</span>` : ""}
    ${facts.length ? `<dl class="facts">${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : `<p class="hint">자동으로 찾은 정보가 없어요. 원문을 확인하세요.</p>`}
    <p class="hint">자동으로 정리한 내용이라 틀릴 수 있어요. 신청 전 원문을 꼭 확인하세요.</p>
    <div class="actions">
      <a class="btn brand" style="display:inline-grid;place-items:center;text-decoration:none" href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener noreferrer">원문 보기</a>
      ${n.deadline ? `<button class="btn ghost" data-ics="${n.id}">캘린더에 추가</button>` : ""}
      <button class="btn ghost" data-star="${n.id}" aria-pressed="${on}">${on ? "저장됨" : "저장"}</button>
    </div>`;
  const sheet = $("#sheet");
  if (!sheet.open) sheet.showModal();
}

// 입력: 공지, 출력 없음; 마감일(시각을 알면 그 시각) 일정 파일(.ics)을 내려받게 한다. 하루 전 알림 포함.
function downloadIcs(n) {
  const p = (s) => s.replace(/[-:]/g, "");
  const text = (s) => String(s).replace(/[\\;,]/g, (c) => "\\" + c).replace(/\n/g, "\\n");
  const timed = n.close_at && n.close_at.includes("T");
  const next = new Date(n.deadline); next.setDate(next.getDate() + 1);
  const when = timed
    ? `DTSTART;TZID=Asia/Seoul:${p(n.close_at)}00\r\nDTEND;TZID=Asia/Seoul:${p(n.close_at)}00`
    : `DTSTART;VALUE=DATE:${p(n.deadline)}\r\nDTEND;VALUE=DATE:${p(iso(next))}`;
  const body = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//SCNU Lens//KO", "BEGIN:VEVENT",
    `UID:scnu-lens-${n.id}@scnu-lens`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").slice(0, 15)}Z`, when,
    `SUMMARY:${text("[마감] " + n.title)}`, `URL:${safeUrl(n.url)}`, `DESCRIPTION:${text(n.board + "\n" + n.url)}`,
    "BEGIN:VALARM", "ACTION:DISPLAY", "TRIGGER:-P1D", `DESCRIPTION:${text("내일 마감: " + n.title)}`, "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([body], { type: "text/calendar;charset=utf-8" }));
  a.download = `scnu-lens-${n.id}.ics`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ───────── 이벤트 ─────────
function toggleStar(id) {
  saved.has(id) ? saved.delete(id) : saved.add(id);
  store.set("scnu-lens-saved", [...saved]);
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a");
  if (!t) return;
  const d = t.dataset;
  if (d.go) { location.hash = d.go === "feed" ? "" : d.go; if (d.go === "feed") render(); }
  else if (d.tab) { state.tab = d.tab; state.chip = "all"; state.shown = PAGE; state.editing = false; renderFeed(); }
  else if (d.chip) { state.chip = d.chip; state.shown = PAGE; renderFeed(); }
  else if ("sort" in d) { state.sort = state.sort === "latest" ? "deadline" : "latest"; state.shown = PAGE; renderFeed(); }
  else if ("more" in d) { state.shown += PAGE; render(); }
  else if (d.open) { openSheet(Number(d.open)); }
  else if (d.star) {
    toggleStar(Number(d.star));
    if ($("#sheet").open) openSheet(Number(d.star));
    render();
  }
  else if (d.ics) { downloadIcs(BY_ID.get(Number(d.ics))); }
  else if (d.month) { state.month = new Date(state.month.getFullYear(), state.month.getMonth() + Number(d.month), 1); state.day = null; renderCalendar(); }
  else if (d.day) { state.day = state.day === d.day ? null : d.day; renderCalendar(); }
  else if ("edit" in d) { state.editing = true; renderFeed(); }
  else if ("cancel" in d) { state.editing = false; render(); }
  else if (d.kw) { t.setAttribute("aria-pressed", t.getAttribute("aria-pressed") !== "true"); }
});
document.addEventListener("keydown", (e) => {
  // 직접 입력한 관심 키워드는 Enter로 태그에 추가한다(폼 제출 대신).
  if (e.key !== "Enter" || e.target.name !== "extra") return;
  e.preventDefault();
  const kw = e.target.value.trim();
  if (!kw) return;
  const tags = $("#interest-tags");
  const existing = [...tags.querySelectorAll("[data-kw]")].find((b) => b.dataset.kw.toLowerCase() === kw.toLowerCase());
  if (existing) existing.setAttribute("aria-pressed", "true");
  else tags.insertAdjacentHTML("beforeend", `<button type="button" class="tag" data-kw="${esc(kw)}" aria-pressed="true">${esc(kw)}</button>`);
  e.target.value = "";
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "profile-form") return;
  e.preventDefault();
  const form = e.target;
  const extra = form.extra.value.trim();
  const interests = [...form.querySelectorAll('[data-kw][aria-pressed="true"]')].map((b) => b.dataset.kw);
  if (extra && !interests.includes(extra)) interests.push(extra);
  profile = { dept: form.dept.value.trim(), interests: interests.slice(0, 20) };
  store.set("scnu-lens-profile", profile);
  state.editing = false;
  if (view() === "feed") state.tab = "me";
  render();
});
$("#q").addEventListener("input", (e) => { state.q = e.target.value.trim(); state.shown = PAGE; state.chip = "all"; renderFeed(); });
$("#sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") e.target.close(); }); // 바깥을 누르면 닫힘
window.addEventListener("hashchange", render);

// 학과 입력 자동완성: 수집한 학과·전공 게시판 이름
$("#departments").innerHTML = [...new Set(NOTICES.map((n) => n.board.replace(/\s*공지$/, "")).filter((b) => /(학과|전공|학부|교육과)$/.test(b)))]
  .sort().map((b) => `<option value="${esc(b)}">`).join("");
renderFooter();
render();
</script>
</body>
</html>
